name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 gives gitleaks-action the full history it needs to resolve
      # the push diff range (e.g. `<prev>^..<head>`). A shallow clone (depth 1,
      # the default) lacks the parent commit, so gitleaks' git-diff scan fails
      # with "unknown revision ... not in the working tree" and the job errors
      # out even when no secret exists. See gitleaks-action README.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test (deterministic suite)
        run: pnpm -r test

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Vocabulary drift check (single source of truth)
        run: pnpm drift:check

      - name: Deterministic eval gates
        run: pnpm evals:deterministic

      - name: SQLite runtime version assertion (>= 3.51.3)
        run: pnpm sqlite:version

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        # Auto-detects .gitleaks.toml in the repo root. Open-source gitleaks
        # needs no license; lockfile + synthetic data are allowlisted by path.

      # Dependency audit is a HARD gate: any high/critical advisory blocks CI.
      # Resolved 2026-10-29: vitest 4.1.12 + explicit vite 6.4.5 clears every
      # advisory (verified 0 at all severities against registry.npmjs.org).
      # Note: the previous "vitest 3.x is the proper fix" note was wrong - 3.2.7
      # still pulls tinypool ^1.1.1 (critical) and vite 5.x (high, <=6.4.3).
      # Pin the registry explicitly so a mirror lacking the audit endpoint cannot
      # silently disable this gate (npmmirror.com has no /-/npm/v1/security/audits).
      - name: Dependency audit
        run: pnpm audit --audit-level high --registry=https://registry.npmjs.org
