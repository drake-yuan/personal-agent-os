name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test (deterministic suite)
        run: pnpm -r test

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Vocabulary drift check (single source of truth)
        run: pnpm drift:check

      - name: Deterministic eval gates
        run: pnpm evals:deterministic

      - name: SQLite runtime version assertion (>= 3.51.3)
        run: pnpm sqlite:version

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Dependency audit
        run: pnpm audit --audit-level high
